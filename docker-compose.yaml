services:
  backend:
    container_name: backend
    build:
      context: .
      dockerfile: appliance-store-backend/Dockerfile

    restart: always
    ports:
      - "${BACKEND_SERVER_PORT:-8080}:${BACKEND_SERVER_PORT:-8080}"

    environment:
      BACKEND_SERVER_PORT: ${BACKEND_SERVER_PORT:-8080}
      BACKEND_PRIVATE_KEY: ${BACKEND_PRIVATE_KEY:-dummyKey}
      BACKEND_PUBLIC_KEY: ${BACKEND_PUBLIC_KEY:-dummyKey}

      BACKEND_DB_USERNAME: ${BACKEND_DB_USERNAME:-postgres}
      BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:-password}
      BACKEND_DB_NAME: ${BACKEND_DB_NAME:-store}
      BACKEND_DB_HOST: ${BACKEND_DB_HOST:-jdbc:postgresql://postgres:5432/store}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-Authorization,Content-Type}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-GET,POST,PUT,DELETE,OPTIONS}

      SPRING_PROFILES_ACTIVE: ${BACKEND_SPRING_PROFILES_ACTIVE:-local}
      NOTIFICATION_STARTER_TOPIC: ${SHARED_KAFKA_TOPIC_NOTIFICATIONS:-notification-events}
      SHARED_KAFKA_BOOTSTRAP_SERVERS: ${SHARED_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}

    depends_on:
      postgres:
        condition: service_healthy
      notification:
        condition: service_healthy

  frontend:
    container_name: frontend
    build:
      context: ./appliance-store-frontend
      args:
        REACT_APP_BACKEND_API_URL: ${REACT_APP_BACKEND_API_URL:-http://localhost:${BACKEND_SERVER_PORT:-8080}}
    restart: always
    ports:
      - "${FRONTEND_SERVER_PORT:-3000}:${FRONTEND_SERVER_PORT:-3000}"

    environment:
      REACT_APP_BACKEND_API_URL: ${REACT_APP_BACKEND_API_URL:-http://localhost:${BACKEND_SERVER_PORT:-8080}}
      PORT: ${FRONTEND_SERVER_PORT:-3000}

    depends_on:
      backend:
        condition: service_healthy

  notification:
    container_name: notification
    build: ./appliance-notification
    restart: always
    ports:
      - "${NOTIFICATION_SERVER_PORT:-10001}:${NOTIFICATION_SERVER_PORT:-10001}"

    environment:
      NOTIFICATION_SERVER_PORT: ${NOTIFICATION_SERVER_PORT:-10001}
      SHARED_KAFKA_BOOTSTRAP_SERVERS: ${SHARED_KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
      NOTIFICATION_KAFKA_CONSUMER_GROUP: ${NOTIFICATION_KAFKA_CONSUMER_GROUP:-notification-service-group}
      SHARED_KAFKA_TOPIC_NOTIFICATIONS: ${SHARED_KAFKA_TOPIC_NOTIFICATIONS:-notification-events}
      SHARED_KAFKA_TOPIC_NOTIFICATIONS_DLT: ${SHARED_KAFKA_TOPIC_NOTIFICATIONS_DLT:-notification-events.DLT}
      NOTIFICATION_SMTP_HOST: ${NOTIFICATION_SMTP_HOST:-smtp.gmail.com}
      NOTIFICATION_SMTP_PORT: ${NOTIFICATION_SMTP_PORT:-587}
      NOTIFICATION_SMTP_USERNAME: ${NOTIFICATION_SMTP_USERNAME:-appliance.store.epam@gmail.com}
      NOTIFICATION_SMTP_PASSWORD: ${NOTIFICATION_SMTP_PASSWORD:-Appliance11@}
      NOTIFICATION_SMTP_AUTH: ${NOTIFICATION_SMTP_AUTH:-false}
      NOTIFICATION_SMTP_STARTTLS: ${NOTIFICATION_SMTP_STARTTLS:-false}
      NOTIFICATION_MAIL_FROM: ${NOTIFICATION_MAIL_FROM:-appliance.store.epam@gmail.com}

    depends_on:
      kafka:
        condition: service_healthy

  kafka:
    container_name: kafka
    image: apache/kafka:4.3.1
    restart: always
    ports:
      - "9092:9092"
      - "9094:9094"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'

      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTEXT:PLAINTEXT,PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT'

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      LOG4J_LOGGER_KAFKA_AUTHORIZER_LOGGER: 'DEBUG'

    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    container_name: postgres
    image: postgres:17-alpine
    restart: always

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: ${BACKEND_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${BACKEND_DB_PASSWORD:-password}
      POSTGRES_DB: ${BACKEND_DB_NAME:-store}

    volumes:
      - postgres-data:/var/lib/postgres/data

    healthcheck:
      test: pg_isready -U ${BACKEND_DB_USERNAME:-postgres} -p 5432
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    restart: always
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
